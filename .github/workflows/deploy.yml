name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cartes-500/**'
      - 'images/cartes-500/**'
      - 'scripts/build_site.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build site
        run: python scripts/build_site.py --out _site/index.html --img images/cartes-500/

      - name: Assemble artifact
        run: |
          mkdir -p _site/images
          cp -R images/cartes-500 _site/images/
          rm -f _site/images/cartes-500/_manifest.csv
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
